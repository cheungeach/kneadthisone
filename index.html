<style>

.char{transform-origin:50% 100%;animation-duration:calc(3.4s*var(--t,1));animation-timing-function:ease-in-out;animation-iteration-count:infinite}

@keyframes hop{0%,100%{transform:translateY(0) scale(1.02,.98)}45%{transform:translateY(-16px) scale(.99,1.02)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-24px) rotate(-4deg)}70%{transform:translateY(-4px) rotate(3deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes huff{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.96)}}
@keyframes tilt{0%,100%{transform:rotate(0)}40%,70%{transform:rotate(-9deg)}}
@keyframes munch{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@keyframes tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg) translateX(-3px)}}

@keyframes droop{0%,100%{transform:translateY(6px) rotate(3deg)}50%{transform:translateY(8px) rotate(4deg)}}

.m-idle{animation-name:breathe}
.m-happy,.m-loved{animation-name:hop;animation-duration:calc(.8s*var(--t,1))}
.m-excited{animation-name:jump;animation-duration:calc(.65s*var(--t,1))}
.m-proud{animation-name:huff;animation-duration:calc(2.2s*var(--t,1))}
.m-focused{animation-name:nod;animation-duration:calc(2.4s*var(--t,1))}
.m-content{animation-name:sway;animation-duration:calc(4s*var(--t,1))}
.m-sleepy{animation-name:sway;animation-duration:calc(5.5s*var(--t,1))}
.m-asleep{animation-name:sleepb;animation-duration:5s}
.m-eating{animation-name:munch;animation-duration:calc(.45s*var(--t,1))}
.m-curious{animation-name:tilt;animation-duration:calc(3s*var(--t,1))}
.m-restless{animation-name:tap;animation-duration:calc(.5s*var(--t,1))}
.m-flat{animation-name:breathe;animation-duration:4.6s}
.m-drained{animation-name:droop;animation-duration:4.6s}
.m-anxious{animation-name:jit;animation-duration:.22s;animation-timing-function:linear}
.m-grumpy{animation-name:huff;animation-duration:calc(1.4s*var(--t,1))}
.tremble{animation:jit .3s linear infinite}
@keyframes floatz{0%{transform:translate(0,6px) scale(.6);opacity:0}25%{opacity:1}100%{transform:translate(12px,-22px) scale(1.1);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.2}50%{transform:scale(1) rotate(20deg);opacity:1}}
@keyframes pop{0%,100%{transform:scale(.7);opacity:.3}50%{transform:scale(1.1);opacity:1}}
@keyframes dripp{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
.fx *{transform-box:fill-box;transform-origin:center}
.z{animation:floatz 2.8s ease-out infinite}.z2{animation:floatz 2.8s ease-out .9s infinite}.z3{animation:floatz 2.8s ease-out 1.8s infinite}
.tw{animation:twinkle 1.2s ease-in-out infinite}.tw2{animation:twinkle 1.2s ease-in-out .4s infinite}
.pp{animation:pop 1.4s ease-in-out infinite}.pp2{animation:pop 1.4s ease-in-out .25s infinite}.pp3{animation:pop 1.4s ease-in-out .5s infinite}
.dr{animation:dripp 1.5s ease-in infinite}
.cr{animation:fall .9s ease-in infinite}.cr2{animation:fall .9s ease-in .3s infinite}.cr3{animation:fall .9s ease-in .6s infinite}
@keyframes walk{0%{left:6%;transform:scaleX(1)}46%{left:58%;transform:scaleX(1)}50%{left:58%;transform:scaleX(-1)}96%{left:6%;transform:scaleX(-1)}100%{left:6%;transform:scaleX(1)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes waddle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.walker{position:absolute;bottom:14%;width:22%;animation:walk 16s linear infinite}

.waddle{animation:waddle 1.2s ease-in-out infinite;transform-origin:50% 100%}
.idle{animation:breathe 3.6s ease-in-out infinite;transform-origin:50% 100%}
.rig{position:relative;--d:1}
.rig .all{position:absolute;inset:0;transform-origin:50% 100%}
.rig img{position:absolute;display:block;pointer-events:none}
.rig .p{animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.rig .all{animation-iteration-count:infinite;animation-timing-function:ease-in-out}
@keyframes k-sw{0%,100%{rotate:var(--a1)}50%{rotate:var(--a2)}}
@keyframes k-bob{0%,100%{translate:0 0}50%{translate:0 var(--by)}}
@keyframes k-breathe{0%,100%{scale:1 1}50%{scale:1.012 .982}}
@keyframes k-hop{0%,100%{translate:0 0;scale:1.04 .95}12%{scale:1 1}45%{translate:0 var(--hy);scale:.97 1.04}80%{translate:0 0;scale:1 1}}
@keyframes k-gallop{0%,100%{translate:0 0;rotate:0deg}25%{translate:0 var(--by);rotate:calc(var(--d)*-2.5deg)}50%{translate:0 0;rotate:0deg}75%{translate:0 calc(var(--by)*.4);rotate:calc(var(--d)*2deg)}}
@keyframes k-waddle{0%,100%{rotate:-5deg;translate:0 0}25%{translate:0 -4px}50%{rotate:5deg;translate:0 0}75%{translate:0 -4px}}
@keyframes k-jit{0%,100%{translate:0 0}25%{translate:-2px 1px}50%{translate:2px -1px}75%{translate:-1px -1px}}
@keyframes k-tilt{0%,100%{rotate:0deg}30%,70%{rotate:var(--a1)}}
@keyframes k-twitch{0%,86%,100%{rotate:0deg}90%{rotate:var(--a1)}94%{rotate:0deg}97%{rotate:calc(var(--a1)*.5)}}
@keyframes k-sink{0%,100%{translate:0 4px;scale:1 .97}50%{translate:0 6px;scale:1.005 .96}}

/* idle */
.a-idle .all{animation-name:k-breathe;animation-duration:calc(3.2s*var(--t,1))}
.a-idle .r-tail{--a1:calc(var(--d)*-5deg);--a2:calc(var(--d)*6deg);animation-name:k-sw;animation-duration:calc(2.8s*var(--t,1))}
.a-idle .r-head{--a1:calc(var(--hk,1)*-1.5deg);--a2:calc(var(--hk,1)*2deg);animation-name:k-sw;animation-duration:calc(3.2s*var(--t,1))}
.a-idle .r-earA{--a1:-14deg;animation-name:k-twitch;animation-duration:calc(4.2s*var(--t,1))}
.a-idle .r-earB{--a1:-3deg;--a2:4deg;animation-name:k-sw;animation-duration:calc(3.4s*var(--t,1))}
.a-idle .r-flipL{--a1:-3deg;--a2:4deg;animation-name:k-sw;animation-duration:calc(3s*var(--t,1))}
.a-idle .r-flipR{--a1:3deg;--a2:-4deg;animation-name:k-sw;animation-duration:calc(3s*var(--t,1))}

/* walk */
.a-walk .all{--by:-5px;animation-name:k-bob;animation-duration:calc(.45s*var(--t,1))}
.a-walk .r-legNF,.a-walk .r-legFH{--a1:-16deg;--a2:16deg;animation-name:k-sw;animation-duration:calc(.9s*var(--t,1))}
.a-walk .r-legFF,.a-walk .r-legNH{--a1:16deg;--a2:-16deg;animation-name:k-sw;animation-duration:calc(.9s*var(--t,1))}
.a-walk .r-tail{--a1:calc(var(--d)*-8deg);--a2:calc(var(--d)*8deg);animation-name:k-sw;animation-duration:calc(.9s*var(--t,1))}
.a-walk .r-head{--a1:calc(var(--hk,1)*-3deg);--a2:calc(var(--hk,1)*2deg);animation-name:k-sw;animation-duration:calc(.45s*var(--t,1))}
.a-walk .r-earA{--a1:-6deg;--a2:4deg;animation-name:k-sw;animation-duration:calc(.45s*var(--t,1))}
.a-walk .r-earB{--a1:-6deg;--a2:8deg;animation-name:k-sw;animation-duration:calc(.45s*var(--t,1))}
.a-walk .r-flipL{--a1:-4deg;--a2:18deg;animation-name:k-sw;animation-duration:calc(.9s*var(--t,1))}
.a-walk .r-flipR{--a1:4deg;--a2:-18deg;animation-name:k-sw;animation-duration:calc(.9s*var(--t,1));animation-delay:calc(-.45s*var(--t,1))}
.nolegs.a-walk .all{--hy:-16px;animation-name:k-hop;animation-duration:calc(.7s*var(--t,1))}
.waddler.a-walk .all{animation-name:k-waddle;animation-duration:calc(.9s*var(--t,1))}

/* run */
.a-run .all{--by:-10px;animation-name:k-gallop;animation-duration:calc(.44s*var(--t,1))}
.a-run .r-legNF,.a-run .r-legFF{--a1:calc(var(--d)*-34deg);--a2:calc(var(--d)*22deg);animation-name:k-sw;animation-duration:calc(.44s*var(--t,1))}
.a-run .r-legFF{animation-delay:calc(-.07s*var(--t,1))}
.a-run .r-legNH,.a-run .r-legFH{--a1:calc(var(--d)*24deg);--a2:calc(var(--d)*-30deg);animation-name:k-sw;animation-duration:calc(.44s*var(--t,1));animation-delay:calc(-.2s*var(--t,1))}
.a-run .r-legFH{animation-delay:calc(-.27s*var(--t,1))}
.a-run .r-tail{--a1:calc(var(--d)*-22deg);--a2:calc(var(--d)*-12deg);animation-name:k-sw;animation-duration:calc(.22s*var(--t,1))}
.a-run .r-head{--a1:calc(var(--d)*var(--hk,1)*3deg);--a2:calc(var(--d)*var(--hk,1)*-3deg);animation-name:k-sw;animation-duration:calc(.44s*var(--t,1))}
.a-run .r-earA,.a-run .r-earB{--a1:-18deg;--a2:-8deg;animation-name:k-sw;animation-duration:calc(.22s*var(--t,1))}
.a-run .r-flipL{--a1:-10deg;--a2:40deg;animation-name:k-sw;animation-duration:calc(.3s*var(--t,1))}
.a-run .r-flipR{--a1:10deg;--a2:-40deg;animation-name:k-sw;animation-duration:calc(.3s*var(--t,1))}
.nolegs.a-run .all{--hy:-30px;animation-name:k-hop;animation-duration:calc(.48s*var(--t,1))}
.waddler.a-run .all{animation-name:k-waddle;animation-duration:calc(.45s*var(--t,1))}

/* happy */
.a-happy .all{--hy:-14px;animation-name:k-hop;animation-duration:calc(.55s*var(--t,1))}
.a-happy .r-tail{--a1:calc(var(--d)*-24deg);--a2:calc(var(--d)*20deg);animation-name:k-sw;animation-duration:calc(.2s*var(--t,1))}
.a-happy .r-head{--a1:calc(var(--hk,1)*-6deg);--a2:calc(var(--hk,1)*6deg);animation-name:k-sw;animation-duration:calc(.55s*var(--t,1))}
.a-happy .r-earA{--a1:-14deg;--a2:6deg;animation-name:k-sw;animation-duration:calc(.28s*var(--t,1))}
.a-happy .r-earB{--a1:-10deg;--a2:12deg;animation-name:k-sw;animation-duration:calc(.28s*var(--t,1))}
.a-happy .r-flipL{--a1:0deg;--a2:45deg;animation-name:k-sw;animation-duration:calc(.25s*var(--t,1))}
.a-happy .r-flipR{--a1:0deg;--a2:-45deg;animation-name:k-sw;animation-duration:calc(.25s*var(--t,1))}
.a-happy .r-legNF,.a-happy .r-legFF{--a1:calc(var(--d)*-6deg);--a2:calc(var(--d)*8deg);animation-name:k-sw;animation-duration:calc(.55s*var(--t,1))}

/* curious */
.a-curious .r-head{--a1:calc(var(--d)*var(--hk,1)*-13deg);animation-name:k-tilt;animation-duration:calc(3s*var(--t,1))}
.a-curious .all{animation-name:k-breathe;animation-duration:calc(3s*var(--t,1))}
.a-curious .r-earA{--a1:-10deg;animation-name:k-tilt;animation-duration:calc(3s*var(--t,1))}
.a-curious .r-earB{--a1:-14deg;animation-name:k-tilt;animation-duration:calc(3s*var(--t,1))}
.a-curious .r-tail{--a1:calc(var(--d)*-4deg);--a2:calc(var(--d)*10deg);animation-name:k-sw;animation-duration:calc(1.6s*var(--t,1))}
.a-curious .r-flipL{--a1:0deg;--a2:14deg;animation-name:k-sw;animation-duration:calc(1.5s*var(--t,1))}
.a-curious .r-flipR{--a1:0deg;--a2:-6deg;animation-name:k-sw;animation-duration:calc(1.5s*var(--t,1))}
.nohead.a-curious .all{--a1:calc(var(--d)*-6deg);animation-name:k-tilt;animation-duration:calc(3s*var(--t,1))}

/* eat */
.a-eat .r-head{--a1:calc(var(--d)*var(--hk,1)*10deg);--a2:calc(var(--d)*var(--hk,1)*18deg);animation-name:k-sw;animation-duration:calc(.42s*var(--t,1))}
.a-eat .all{animation-name:k-breathe;animation-duration:calc(2.4s*var(--t,1))}
.a-eat .r-tail{--a1:calc(var(--d)*-4deg);--a2:calc(var(--d)*8deg);animation-name:k-sw;animation-duration:calc(1.4s*var(--t,1))}
.a-eat .r-earA,.a-eat .r-earB{--a1:-4deg;--a2:4deg;animation-name:k-sw;animation-duration:calc(.42s*var(--t,1))}
.a-eat .r-flipL{--a1:4deg;--a2:10deg;animation-name:k-sw;animation-duration:calc(.42s*var(--t,1))}
.a-eat .r-flipR{--a1:-4deg;--a2:-10deg;animation-name:k-sw;animation-duration:calc(.42s*var(--t,1))}
.nohead.a-eat .all{--a1:calc(var(--d)*2deg);--a2:calc(var(--d)*5deg);animation-name:k-sw;animation-duration:calc(.42s*var(--t,1))}

/* sleep: legs fold under, body settles, head and tail curl */
.a-sleep .all{animation-name:k-sleep;animation-duration:4.2s}
.a-sleep:not(.nolegs) .all{translate:0 var(--sl,18%)}
.a-sleep .r-head{rotate:calc(var(--d)*var(--hk,1)*18deg);translate:0 7%}
.a-sleep .r-tail{rotate:calc(var(--d)*-38deg)}
.a-sleep .r-earA{rotate:-48deg}
.a-sleep .r-earB{rotate:22deg}
.a-sleep .r-flipL{rotate:6deg}
.a-sleep .r-flipR{rotate:-6deg}
.a-sleep .r-legNF,.a-sleep .r-legFF{scale:1 .42;rotate:calc(var(--d)*-14deg)}
.a-sleep .r-legNH,.a-sleep .r-legFH{scale:1 .42;rotate:calc(var(--d)*14deg)}
@keyframes k-sleep{0%,100%{scale:1.01 .97}50%{scale:1.02 .99}}

/* nervous */
.a-nervous .all{animation-name:k-jit;animation-duration:.2s;animation-timing-function:linear}
.a-nervous .r-tail{rotate:calc(var(--d)*-34deg)}
.a-nervous .r-head{rotate:calc(var(--d)*var(--hk,1)*7deg);translate:0 2.5%}
.a-nervous .r-earA{rotate:-30deg}
.a-nervous .r-earB{rotate:14deg}
.a-nervous .r-flipL{rotate:-6deg}
.a-nervous .r-flipR{rotate:6deg}
.a-nervous .r-legNH,.a-nervous .r-legFH{rotate:calc(var(--d)*-6deg)}

/* sad / drained */
.a-sad .all{animation-name:k-sink;animation-duration:calc(4.6s*var(--t,1))}
.a-sad .r-head{rotate:calc(var(--d)*var(--hk,1)*14deg);translate:0 4%}
.a-sad .r-tail{rotate:calc(var(--d)*-26deg)}
.a-sad .r-earA{rotate:-38deg}
.a-sad .r-earB{rotate:18deg}
.a-sad .r-flipL{rotate:-2deg}
.a-sad .r-flipR{rotate:2deg}
/* grumpy */
@keyframes k-huff{0%,100%{scale:1 1}50%{scale:1.035 .965}}
.a-grumpy .all{animation-name:k-huff;animation-duration:calc(1.3s*var(--t,1))}
.a-grumpy .r-tail{--a1:calc(var(--d)*-22deg);--a2:calc(var(--d)*14deg);animation-name:k-sw;animation-duration:calc(.32s*var(--t,1))}
.a-grumpy .r-head{rotate:calc(var(--d)*var(--hk,1)*6deg);translate:0 2%}
.a-grumpy .r-earA{rotate:-22deg}
.a-grumpy .r-earB{rotate:10deg}
.a-grumpy .r-flipL{--a1:-8deg;--a2:2deg;animation-name:k-sw;animation-duration:calc(.32s*var(--t,1))}
.a-grumpy .r-flipR{--a1:8deg;--a2:-2deg;animation-name:k-sw;animation-duration:calc(.32s*var(--t,1))}
.a-grumpy .r-legNF{--a1:0deg;--a2:calc(var(--d)*-10deg);animation-name:k-sw;animation-duration:calc(.65s*var(--t,1))}
@media (prefers-reduced-motion: reduce){.rig .p,.rig .all{animation:none!important}}

      stageSrc: stageSrc, stageAlt: (isMirror ? 'You' : name + ' the ' + animal.toLowerCase()) + ', ' + M.label.toLowerCase(),
      imgStyle: 'max-height: ' + (isMirror ? 200 : 170) + 'px; max-width: 250px; width: auto; height: auto; display: block; filter: saturate(' + sat + ') ' + glow,
      showBadge: isMirror, fx: fx,
      moodLabel: (isMirror ? 'Mirrors you: ' : '') + M.label + ' · ' + act,
      nowHead: nowHead, evtTitle: evtTitle, evtMeta: evtMeta, sit: sit, line: line,
      callHead: callHead, call: view === 'pet' && asleepPet ? 'No. It sleeps through it' : C.pick.o.label,
      hasSay: !!say, say: say, because: because, hasNudge: hasNudge, nudge: nudge, opts: opts,
      showStats: view === 'cal', stats: stats, why: why,
      showMirrorPick: isMirror, yous: yous,
      lookLabel: animal,
      reactions: reactions,
      showDownloadBtn: s.stage === 'idle', showSignup: s.stage === 'signup', signedUp: s.stage === 'done',
      openSignup: function () { self.setState({ stage: 'signup' }); },
      doSignup: function () { self.setState({ stage: 'done' }); },
      notSent: !s.sent, sent: s.sent,
      sendFeedback: function () { self.setState({ sent: true }); }
    };
  }
}


mountPage(Component);
</script>
